<!DOCTYPE html>
<html lang="pt">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Biblioteca Camomila</title>
  <meta name="description"
    content="Aplicação de gestão para a Biblioteca Camomila com catálogo, empréstimos, leitores e estatísticas em tempo real.">
  <link rel="icon" type="image/png" href="./favicon.png">
  <link rel="stylesheet" href="./src/style.css">
</head>

<body>
  <div id="app">
    <!-- Sidebar Navigation -->
    <aside class="sidebar">
      <div class="sidebar-logo">
        <div class="sidebar-logo-icon">
          <img src="./favicon.png" alt="Biblioteca Camomila Logo" style="width: 26px; height: 26px; object-fit: contain;">
        </div>
        <div class="sidebar-logo-text">Biblioteca Camomila</div>
      </div>

      <nav class="nav-group">
        <a class="nav-item active" data-view="dashboard">
          <span>📊</span> Painel Principal
        </a>
        <a class="nav-item" data-view="catalog">
          <span>📖</span> Catálogo de Livros
        </a>
        <a class="nav-item" data-view="members">
          <span>👥</span> Directório Leitores
        </a>
        <a class="nav-item" data-view="loans">
          <span>🔄</span> Empréstimos
        </a>
        <a class="nav-item" data-view="settings">
          <span>⚙️</span> Definições & Backup
        </a>
      </nav>

      <div class="sidebar-footer">
        <div style="font-size:0.75rem; color:var(--text-dim); text-align:center;">
          Biblioteca Camomila v1.0<br>
          Acervo Actualizado
        </div>
      </div>
    </aside>

    <!-- Main Content Area -->
    <div class="main-wrapper">
      <!-- Top Navbar Header -->
      <header class="top-header">
        <div style="display:flex; align-items:center; gap:0.75rem;">
          <button id="btn-mobile-toggle" class="btn btn-secondary btn-sm mobile-toggle-btn" aria-label="Abrir Menu">☰
            Menu</button>
          <div class="header-search">
            <span class="header-search-icon">🔍</span>
            <input type="text" id="global-search-input" placeholder="Pesquisa rápida no acervo...">
          </div>
        </div>

        <div class="header-actions">
          <select id="theme-selector" class="btn btn-secondary btn-sm" style="padding:0.4rem 0.65rem; cursor:pointer;"
            title="Escolher Tema Visual">
            <option value="dark">🌙 Escuro (Midnight)</option>
            <option value="light">☀️ Claro (Nórdico)</option>
            <option value="camomila">🌿 Camomila (Verde)</option>
            <option value="parchment">📜 Pergaminho (Sépia)</option>
            <option value="violet">💜 Violeta (Cyber)</option>
          </select>

          <div id="user-role-badge" class="role-badge">
            <span id="role-badge-icon">👑</span>
            <span id="role-badge-label">Bibliotecário</span>
          </div>

          <div id="user-profile-btn" class="user-profile" title="Sessão Utilizador">
            <div id="user-avatar" class="user-avatar">B</div>
            <div style="display:flex; flex-direction:column;">
              <span id="user-name-display" style="font-size:0.85rem; font-weight:700;">Bibliotecário</span>
              <span id="btn-logout" style="font-size:0.72rem; color:var(--accent-primary); cursor:pointer;">Terminar
                Sessão</span>
            </div>
          </div>
        </div>
      </header>

      <!-- Dynamic View Container -->
      <main id="content-viewport" class="content-viewport">
        <!-- Rendered view components go here -->
      </main>
    </div>
  </div>

  <!-- Portal Containers -->
  <div id="auth-portal"></div>
  <div id="toast-container"></div>

  <script type="module" src="/src/app.js"></script>
</body>

</html>
